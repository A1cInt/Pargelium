name: Pargelium Cloud Android CI

on:
  push:
    branches: [ "main", "master", "dev", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Pargelium APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK (with Native JamesDSP JNI)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Pargelium-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Pargelium-Release-${{ github.sha }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 30

      - name: Send Build Info & APK to Telegram Topic (t.me/AlcIntGroup/659)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: "659"
          BUILD_VARIANT: ${{ github.event.inputs.build_type || 'debug' }}
          SIGNED_REL_PATH: ${{ steps.sign_app.outputs.signedReleaseFile }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret is not configured. Skipping Telegram notification."
            exit 0
          fi

          TARGET_CHAT="${CHAT_ID:-@AlcIntGroup}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ "$BUILD_VARIANT" = "release" ] && [ -n "$SIGNED_REL_PATH" ] && [ -f "$SIGNED_REL_PATH" ]; then
            APK_FILE="$SIGNED_REL_PATH"
          else
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] \vert{}\vert{} [ ! -f "$APK_FILE" ]; then
            echo "APK file not found!"
            exit 1
          fi

          FINAL_APK="Pargelium-${BUILD_VARIANT}-${SHORT_SHA}.apk"
          cp "$APK_FILE" "$FINAL_APK"
          FILE_SIZE=$(du -h "$FINAL_APK" | cut -f1)

          CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 5 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="<b>Pargelium Cloud CI Build Completed</b>

          <b>Variant:</b> <code>${BUILD_VARIANT^^}</code>
          <b>Branch:</b> <code>${BRANCH_NAME}</code>
          <b>Commit:</b> <code>${SHORT_SHA}</code>
          <b>Author:</b> <code>${COMMIT_AUTHOR}</code>
          <b>Size:</b> <code>${FILE_SIZE}</code>

          <b>Changelog:</b>
          <pre>${CLEAN_MSG}</pre>

          <a href=\"${RUN_URL}\">View GitHub Actions Run</a>"

          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TARGET_CHAT}" \
            -F "message_thread_id=${TOPIC_ID}" \
            -F "document=@${FINAL_APK}" \
            -F "parse_mode=HTML" \
            -F "caption=${CAPTION}"